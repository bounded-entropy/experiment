[project]
name = "rlstack"
version = "0.0.1"
description = "Thin RL wrapper - Phase A: specs, registries, validation, data objects, store"
requires-python = ">=3.11"
dependencies = [
    "modal>=1.5.4",
]  # Phase A is stdlib-only; numpy/pyarrow/safetensors arrive in Phase B

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rlstack*"]

# the observer UI ships as files, not as a string: index.html, style.css and
# the ES modules under rlstack/observe/web/ are package data
[tool.setuptools.package-data]
"rlstack.observe" = ["web/*"]
